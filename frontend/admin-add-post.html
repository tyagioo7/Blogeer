<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/admin-add-post.css">
    <title>Blogeer - Add Post</title>

</head>

<body>
    <div class=" container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                    <h1 class="mb-4">Add New Post</h1>
                    <form id="add-post-form">
                        <div class="mb-3">
                            <label for="post-title" class="form-label">
                                Post Title
                            </label>
                            <input
                            type="text"
                            id="post-title"
                            class="form-control"
                            placeholder="Enter title"
                            required>
                            </div>

                            <div class="mb-3">
                                <label for="post-slug" class="form-label">
                                    Slug
                                </label>

                                <input
                                type="text"
                                id="post-slug"
                                class="form-control"
                                placeholder="Enter slug"
                                required>
                                </div>

                                <div class="mb-3">
                                    <label for="post-content" class="form-label">
                                        Content
                                    </label>

                                    <textarea
                                    id="post-content"
                                    class="form-control"
                                    rows="8"
                                    placeholder="Enter content"
                                    required></textarea>
                                    </div>

                                    <div class="mb-3">
                                        <label for="post-image" class="form-label">
                                            Cover Image
                                        </label>

                                        <input
                                        type="text"
                                        id="post-image"
                                        class="form-control"
                                        placeholder="Enter image path">
                                        </div>

                                        <div class="mb-3">
                                            <label for="post-status" class="form-label">
                                                Status
                                            </label>

                                            <select
                                            id="post-status"
                                            class="form-select"
                                            required>
                                            <option value="">Select status</option>
                                            <option value="draft">Draft</option>
                                            <option value="published">Published</option>
                                        </select>
                                        </div>

                                        <div class="mb-3">
                                            <label for="post-category" class="form-label">
                                                Category Id
                                            </label>
                                            <input
                                            type="number"
                                            id="post-category"
                                            class="form-control"
                                            placeholder="Enter category Id"
                                            required>
                                            </div>

                                            <div class="mb-4">
                                                <label for="post-userId" class="form-label">
                                                    User ID
                                                </label>

                                                <input
                                                type="number"
                                                id="post-userId"
                                                class="form-control"
                                                placeholder="Enter user Id"
                                                required>
                                                </div>

                                                <button
                                                type="submit"
                                                class="btn btn-primary px-4">
                                                Create Post
                                            </button>
                                            </form>
                                            <p id="add-post-message" class="mt-3"></p>
                                            </div>
                                        </div>
                                        </div>
                                    </div>
                                </div>     
                            </div>
    
    </div>

    
    <script src="./admin-add-post.js"></script>
</body>

</html>
