
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <title>Blogeer - Edit Post</title>

</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-8">

                <div class="card shadow-sm border-0 rounded-4">

                    <div class="card-body p-4 p-md-5">

                        <h1 class="mb-4 fw-bold">
                            Edit Post
                        </h1>

                        <form id="edit-form">

                            <!-- Post ID -->
                            <div class="mb-3">

                                <label
                                    for="edit-id"
                                    class="form-label fw-semibold"
                                >
                                    Post ID
                                </label>

                                <input
                                    type="number"
                                    id="edit-id"
                                    class="form-control"
                                    placeholder="Post ID"
                                    readonly
                                >

                            </div>


                            <!-- Title -->
                            <div class="mb-3">

                                <label
                                    for="edit-title"
                                    class="form-label fw-semibold"
                                >
                                    Post Title
                                </label>

                                <input
                                    type="text"
                                    id="edit-title"
                                    class="form-control"
                                    placeholder="Enter title"
                                    required
                                >

                            </div>


                            <!-- Slug -->
                            <div class="mb-3">

                                <label
                                    for="edit-slug"
                                    class="form-label fw-semibold"
                                >
                                    Slug
                                </label>

                                <input
                                    type="text"
                                    id="edit-slug"
                                    class="form-control"
                                    placeholder="Enter slug"
                                    required
                                >

                            </div>


                            <!-- Content -->
                            <div class="mb-3">

                                <label
                                    for="edit-content"
                                    class="form-label fw-semibold"
                                >
                                    Content
                                </label>

                                <textarea
                                    id="edit-content"
                                    class="form-control"
                                    rows="10"
                                    placeholder="Enter content"
                                    required
                                ></textarea>

                            </div>


                            <!-- Cover Image -->
                            <div class="mb-3">

                                <label
                                    for="edit-image"
                                    class="form-label fw-semibold"
                                >
                                    Cover Image
                                </label>

                                <input
                                    type="text"
                                    id="edit-image"
                                    class="form-control"
                                    placeholder="Enter image path"
                                >

                            </div>


                            <!-- Status -->
                            <div class="mb-3">

                                <label
                                    for="edit-status"
                                    class="form-label fw-semibold"
                                >
                                    Status
                                </label>

                                <select
                                    id="edit-status"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Select status
                                    </option>

                                    <option value="draft">
                                        Draft
                                    </option>

                                    <option value="published">
                                        Published
                                    </option>

                                </select>

                            </div>


                            <!-- Category -->
                            <div class="mb-4">

                                <label
                                    for="edit-category"
                                    class="form-label fw-semibold"
                                >
                                    Category ID
                                </label>

                                <input
                                    type="number"
                                    id="edit-category"
                                    class="form-control"
                                    placeholder="Enter category ID"
                                    required
                                >

                            </div>


                            <!-- Update Button -->
                            <button
                                type="submit"
                                class="btn btn-primary px-4"
                            >
                                Update Post
                            </button>

                        </form>


                        <!-- Message -->
                        <p
                            id="edit-message"
                            class="mt-3 mb-0"
                        ></p>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="./admin-edit-post.js"></script>

</body>

</html>
